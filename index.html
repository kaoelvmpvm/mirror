<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="用反射定律一步一步理解鏡面光路：入射、法線、反射、反向延長與成像。">
  <title>鏡面反射光路實驗室</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
<div class="shell">
  <header class="header">
    <div class="brand"><div class="brand-icon" aria-hidden="true">◉</div><div><div class="eyebrow">INTERACTIVE OPTICS LAB</div><h1>鏡面反射光路實驗室</h1><p>從一條光線出發，理解反射與成像。</p></div></div>
    <div class="header-actions"><button id="reset" class="btn ghost">↺ 重設</button><button id="exportSVG" class="btn ghost">匯出 SVG</button><button id="exportPNG" class="btn primary">↓ 匯出圖片</button></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <section class="section"><div class="section-title"><span>01</span><h2>選擇鏡面</h2></div>
        <div class="seg" data-group="mirror"><button data-val="convex" class="active">凸面鏡</button><button data-val="concave">凹面鏡</button><button data-val="plane">平面鏡</button></div>
      </section>
      <section class="section"><div class="section-title"><span>02</span><h2>光線來源</h2></div>
        <div class="seg" data-group="source"><button data-val="point" class="active">物體頂端</button><button data-val="parallel">平行光束</button></div>
      </section>
      <section class="section"><div class="section-title"><span>03</span><h2>調整條件</h2></div>
        <div class="field" id="distanceField"><label for="distance">物距 <output id="distanceValue">165 cm</output></label><input id="distance" type="range" min="30" max="300" step="1" value="165"></div>
        <div class="field" id="heightField"><label for="height">物體高度 <output id="heightValue">34 cm</output></label><input id="height" type="range" min="10" max="55" step="1" value="34"></div>
        <div class="field" id="radiusField"><label for="radius">曲率半徑 <output id="radiusValue">140 cm</output></label><input id="radius" type="range" min="80" max="200" step="2" value="140"></div>
        <div class="field"><label for="spread">入射點分布 <output id="spreadValue">± 18 cm</output></label><input id="spread" type="range" min="6" max="38" step="1" value="18"></div>
        <div class="field"><label for="count">光線數量 <output id="countValue">2 條</output></label><input id="count" type="range" min="2" max="5" step="1" value="2"></div>
      </section>
      <section class="section"><div class="section-title"><span>04</span><h2>圖面顯示</h2></div>
        <label class="toggle"><input id="normalToggle" type="checkbox" checked><span>選定光線的法線</span></label>
        <label class="toggle"><input id="extensionToggle" type="checkbox" checked><span>反射光反向延長線</span></label>
        <label class="toggle"><input id="fcToggle" type="checkbox" checked><span>焦點 F／曲率中心 C</span></label>
        <label class="toggle"><input id="angleToggle" type="checkbox"><span>圖中角度弧線</span></label>
        <label class="toggle"><input id="gridToggle" type="checkbox"><span>淡色輔助格線</span></label>
        <div class="focus-box"><label class="toggle"><input id="soloToggle" type="checkbox"><span><strong>只觀察一條光線</strong></span></label><label class="focus-label" for="focusRay">正在觀察</label><select id="focusRay" aria-label="選擇要觀察的光線"></select></div>
      </section>
      <section class="section"><div class="section-title"><span>05</span><h2>教學情境</h2></div>
        <div class="presets"><button data-preset="convex">凸面鏡・虛像</button><button data-preset="convexParallel">凸面鏡・平行光</button><button data-preset="concaveReal">凹面鏡・實像</button><button data-preset="concaveFocus">凹面鏡・焦點上</button><button data-preset="concaveVirtual">凹面鏡・焦點內</button><button data-preset="plane">平面鏡・等大像</button></div>
      </section>
    </aside>
    <main class="main">
      <section class="stage card">
        <div class="stage-top"><div><div class="stage-eyebrow">光路觀察區</div><h2 id="sceneTitle">凸面鏡：正立縮小的虛像</h2></div><span class="small-pill" id="stageCount">2 條光線</span></div>
        <div class="stepbar" role="group" aria-label="光路教學步驟">
          <button class="step" data-step="1"><span>01</span>入射</button><button class="step" data-step="2"><span>02</span>法線</button><button class="step" data-step="3"><span>03</span>反射</button><button class="step" data-step="4"><span>04</span>延長</button><button class="step active" data-step="5"><span>05</span>成像</button>
        </div>
        <div class="plot"><svg id="scene" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="可互動鏡面反射光線示意圖"></svg></div>
        <div class="plot-bottom"><div class="legend"><span><i class="stroke incident"></i>入射</span><span><i class="stroke reflected"></i>反射</span><span><i class="stroke normal"></i>法線</span><span><i class="stroke extended"></i>延長線</span><span><i class="stroke image"></i>像</span></div><div class="hint">拖曳物體頂端可改變物距與高度；點選光線可聚焦觀察</div></div>
      </section>
      <section class="summary">
        <div class="readout card"><div class="readout-title">目前步驟 <span id="stepIndex">05 / 05</span></div><h3 id="stepHeading">尋找像的位置</h3><p id="stepDescription"></p><div class="callout" id="physicsNote"></div></div>
        <div class="inspector card"><div class="readout-title">數值觀察 <span>以法線為基準</span></div><div class="angle-row"><div><small>入射角 θᵢ</small><strong id="angleIn">—</strong></div><span class="equals">＝</span><div><small>反射角 θᵣ</small><strong id="angleOut">—</strong></div></div><div class="metrics"><div><small>焦距</small><b id="focalResult">—</b></div><div><small>像距</small><b id="imageDistance">—</b></div></div><div class="image-status"><span id="imageTag">虛像</span><p id="imageDescription"></p></div></div>
      </section>
      <p class="footer-note">本模擬器逐條依反射定律追跡光線；焦距與成像位置以近軸近似標示。離主軸較遠的光線可能出現球面像差，故實際光線不一定完全通過理論像點。</p>
    </main>
  </div>
</div>
</body>
</html>
